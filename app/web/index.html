<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Markwise</title>
  <link rel="stylesheet" href="./bundle.css">
  <style>
    /* --- Colour tokens ------------------------------------------------------
       Light values here, dark values in the prefers-color-scheme block below.
       The app never sets a theme class: the native side switches the window's
       appearance (View ▸ Appearance), and WebKit reports that through
       prefers-color-scheme, so "System" needs no special case. */
    :root {
      --mw-bg: #ffffff;
      --mw-text: #24292e;
      --mw-link: #0b66c3;
      --mw-panel: #f7f7f8;
      --mw-panel-border: #e4e4e7;
      --mw-panel-hover: #e9e9ec;
      --mw-heading: #3f3f46;
      --mw-muted: #52525b;
      --mw-faint: #8a8a8e;
      --mw-popup: #ffffff;
      --mw-popup-border: #d9d9de;
      --mw-field: #fbfbfc;
      --mw-success: #1a7f37;
      --mw-shadow: rgba(0, 0, 0, .14);

      --mw-code-text: #24292e;
      --mw-code-comment: #6a737d;
      --mw-code-keyword: #d73a49;
      --mw-code-string: #032f62;
      --mw-code-number: #005cc5;
      --mw-code-function: #6f42c1;
      --mw-code-type: #22863a;
      --mw-code-invalid: #b31d28;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --mw-bg: #1a1a1a;
        --mw-text: #e2e2e2;
        --mw-link: #6fb3ff;
        --mw-panel: #202020;
        --mw-panel-border: #303030;
        --mw-panel-hover: #2b2b2b;
        --mw-heading: #d4d4d4;
        --mw-muted: #b0b0b0;
        --mw-faint: #8b8b8b;
        --mw-popup: #262626;
        --mw-popup-border: #3a3a3a;
        --mw-field: #1c1c1c;
        --mw-success: #3fb950;
        --mw-shadow: rgba(0, 0, 0, .5);

        --mw-code-text: #e6edf3;
        --mw-code-comment: #8b949e;
        --mw-code-keyword: #ff7b72;
        --mw-code-string: #a5d6ff;
        --mw-code-number: #79c0ff;
        --mw-code-function: #d2a8ff;
        --mw-code-type: #7ee787;
        --mw-code-invalid: #ffa198;
      }

      /* Crepe's own palette (its dark theme is just this set of variables). */
      .milkdown {
        --crepe-color-background: #1a1a1a;
        --crepe-color-on-background: #e6e6e6;
        --crepe-color-surface: #121212;
        --crepe-color-surface-low: #1c1c1c;
        --crepe-color-on-surface: #d1d1d1;
        --crepe-color-on-surface-variant: #a9a9a9;
        --crepe-color-outline: #757575;
        --crepe-color-primary: #b5b5b5;
        --crepe-color-secondary: #4d4d4d;
        --crepe-color-on-secondary: #d6d6d6;
        --crepe-color-inverse: #e5e5e5;
        --crepe-color-on-inverse: #2a2a2a;
        --crepe-color-inline-code: #ff6666;
        --crepe-color-error: #ff6666;
        --crepe-color-hover: #232323;
        --crepe-color-selected: #2f2f2f;
        --crepe-color-inline-area: #2b2b2b;
        --crepe-shadow-1:
          0px 1px 2px 0px rgba(255, 255, 255, .3),
          0px 1px 3px 1px rgba(255, 255, 255, .15);
        --crepe-shadow-2:
          0px 1px 2px 0px rgba(255, 255, 255, .3),
          0px 2px 6px 2px rgba(255, 255, 255, .15);
      }
    }

    html, body { margin: 0; padding: 0; height: 100%; background: var(--mw-bg); }

    /* Text selection. Overrides Crepe's `*::selection` (same specificity, later
       in the cascade). Code blocks draw their own selection layer and are left
       alone.

       These are literal colours, not tokens: WebKit doesn't resolve custom
       properties inside `::selection`, and paints the selection black when it
       can't. For the same reason the dark rule has to sit *after* the light one
       — a media query adds no specificity, so source order decides. */
    .milkdown .ProseMirror *::selection,
    .milkdown .ProseMirror::selection,
    #source::selection { background: #d5d5d5; }

    @media (prefers-color-scheme: dark) {
      /* Crepe nominally selects with #2f2f2f here, but the selection actually
         paints near-black (#040404) because the custom property never resolves
         — so selecting text was all but invisible. This is ~2.9:1 against the
         #1a1a1a page (the 3:1 mark for non-text UI) and leaves the selected
         text itself at 4.8:1. */
      .milkdown .ProseMirror *::selection,
      .milkdown .ProseMirror::selection,
      #source::selection { background: #35659f; }
    }
    #app { height: 100vh; overflow: auto; }
    .milkdown { height: 100%; }
    /* View ▸ Font: `--mw-font` (set inline on <html> by setFontFamily) swaps
       both of Crepe's faces — body and headings alike — and falls back to the
       frame theme's own stacks when no font is chosen. Code blocks keep their
       monospace, and the PDF export inherits whatever is set here. */
    .milkdown {
      --crepe-font-default: var(--mw-font, 'Noto Sans', Arial, Helvetica, sans-serif);
      --crepe-font-title: var(--mw-font, 'Noto Serif', Cambria, 'Times New Roman', Times, serif);
    }
    /* The text fills the window: make it wider and lines get longer. There is
       deliberately no max-width column cap — the window edge is the reader's
       own line-length control. The generous side padding leaves room for the
       floating block (+/drag) handle, which is 66px wide and sits 16px to the
       left of the text — it needs ~82px of clearance or it clips at the
       window edge. */
    /* `--mw-scale` is the Settings ▸ Text size control. It scales the *text* —
       font-size, not CSS `zoom` — because a text size shouldn't move anything
       else: the column doesn't change (smaller text = more words per line),
       images stay the size the author chose, and ProseMirror's caret and
       hit-testing keep working in real page coordinates. (`zoom` broke all
       three: images scaled with the text, the counter-zoomed image wrapper
       still shrank whenever `max-width: 100%` clamped the picture to the
       scaled column, and WebKit kept drawing the caret where it would have
       been at the old factor.)

       Crepe hard-codes its type scale in px, so each size is restated below as
       calc(px × scale). Everything sized relative to text — inline code (87.5%),
       KaTeX (em) — follows automatically, as does anything that just inherits
       (table cells, code blocks, list labels). Spacing that participates in the
       type rhythm (line-height, heading margins, the list-marker box) scales
       with it; structural spacing (column padding, blockquote bar, hr) does not. */
    .milkdown .editor {
      margin: 0 auto;
      padding: 32px 88px 64px;
      font-size: calc(16px * var(--mw-scale, 1));
    }
    .milkdown .ProseMirror h1 { font-size: calc(42px * var(--mw-scale, 1)); line-height: calc(50px * var(--mw-scale, 1)); margin-top: calc(32px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror h2 { font-size: calc(36px * var(--mw-scale, 1)); line-height: calc(44px * var(--mw-scale, 1)); margin-top: calc(28px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror h3 { font-size: calc(32px * var(--mw-scale, 1)); line-height: calc(40px * var(--mw-scale, 1)); margin-top: calc(24px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror h4 { font-size: calc(28px * var(--mw-scale, 1)); line-height: calc(36px * var(--mw-scale, 1)); margin-top: calc(20px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror h5 { font-size: calc(24px * var(--mw-scale, 1)); line-height: calc(32px * var(--mw-scale, 1)); margin-top: calc(16px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror h6 { font-size: calc(18px * var(--mw-scale, 1)); line-height: calc(28px * var(--mw-scale, 1)); margin-top: calc(16px * var(--mw-scale, 1)); }
    .milkdown .ProseMirror p  { font-size: calc(16px * var(--mw-scale, 1)); line-height: calc(24px * var(--mw-scale, 1)); padding: calc(4px * var(--mw-scale, 1)) 0; }
    /* The list marker sits in a fixed 32px box that lines up with a paragraph's
       32px first line (24px line-height + 4px padding each side); scale the box
       so bullets and numbers stay centred on that first line. */
    .milkdown .milkdown-list-item-block li .label-wrapper,
    .milkdown .milkdown-list-item-block li .label-wrapper .label { height: calc(32px * var(--mw-scale, 1)); }
    /* Resized images (src/imageresize.js): the node's width attr is mirrored
       onto the image wrapper as --mw-img-w + data-mw-width. The rendered
       width is min(stored, window) — the size the author chose, unless the
       window is too small for it, in which case the figure scales down to fit
       rather than being cut off. A deliberately-sized image may overflow the
       text column into the margins, centred: 50% of the column minus half the
       image is identical to auto-margin centring when it fits, and symmetric
       overflow when it doesn't. !important throughout because Crepe's viewer
       writes an inline height from its ratio logic, clamps to the column
       (max-width), and has a 100px min-height (with object-fit: cover) that
       would crop a small image instead of shrinking it.
       --mw-img-max is measured per image by src/imageresize.js (twice the
       distance from the image's own block centre to the nearer window edge),
       so an indented figure clamps correctly too. */
    .milkdown .editor .image-wrapper[data-mw-width] {
      margin-left: calc(50% - min(var(--mw-img-w), var(--mw-img-max, 100vw)) / 2);
    }
    .milkdown .editor .image-wrapper[data-mw-width] img {
      width: min(var(--mw-img-w), var(--mw-img-max, 100vw)) !important;
      max-width: none !important;
    }
    /* EVERY document image keeps its own aspect ratio, always. Crepe's viewer
       writes a fixed pixel height when the image loads, computed from the
       column width at that moment; when the width later changes (window
       resized, or the measurement was taken mid-layout on a fresh paste) the
       width clamps but the stale height stays and `object-fit: cover` CROPS
       the picture — until something recreates the view (e.g. moving the
       image) and re-measures. Height follows width instead, and the 100px
       min-height that would distort a small image goes too. */
    .milkdown .editor .milkdown-image-block .image-wrapper img,
    .milkdown .editor .milkdown-image-inline img {
      height: auto !important;
      min-height: 0 !important;
    }
    /* Clicking a figure selects it as one node, and Crepe marks that by
       washing the whole image in the selection colour — over a screenshot it
       reads as "all the text is highlighted", and text-in-image work is
       offloaded to Preview anyway (Open Image in Preview). Show a thin
       outline around the image instead, so cut/delete still have a visible
       target without obscuring the figure. */
    .milkdown .editor .milkdown-image-block.selected > .image-wrapper::before,
    .milkdown .editor .milkdown-image-block.ProseMirror-selectednode > .image-wrapper::before {
      background: transparent;
    }
    .milkdown .editor .milkdown-image-block.selected,
    .milkdown .editor .milkdown-image-block.ProseMirror-selectednode {
      background: transparent;
      outline: none;
    }
    .milkdown .editor .milkdown-image-block.selected .image-wrapper img,
    .milkdown .editor .milkdown-image-block.ProseMirror-selectednode .image-wrapper img {
      outline: 2px solid var(--mw-link);
      outline-offset: 1px;
      border-radius: 2px;
    }

    /* Crepe's own handle drags height only and stored a lossy ratio; the
       corner handle replaces it. */
    .milkdown .editor .milkdown-image-block .image-resize-handle { display: none; }
    .mw-image-resize {
      position: absolute;
      right: -7px;
      bottom: -7px;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 2px solid var(--mw-bg);
      background: var(--mw-link);
      cursor: nwse-resize;
      opacity: 0;
      transition: opacity .15s;
      z-index: 2;
      /* Capture the pointer cleanly during the drag. */
      touch-action: none;
    }
    .milkdown .editor .image-wrapper:hover > .mw-image-resize,
    .mw-image-resize.dragging { opacity: 1; }

    /* Links: classic blue, underlined, pointer cursor. */
    .milkdown .editor a,
    .milkdown .editor a * { color: var(--mw-link) !important; text-decoration: underline; cursor: pointer; }

    /* Inline code is styled `display: inline-block`, so a long unbroken token
       (e.g. `exp_fu_overrides`) never wraps and spills into the next table
       column. Inside table cells, let cell content — and inline code in
       particular — break so it stays within its column. */
    .milkdown .editor :is(td, th) { overflow-wrap: anywhere; }
    .milkdown .editor :is(td, th) code {
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* --- Markdown source view (⌘/) ----------------------------------------- */
    #source {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 32px 88px 64px;
      border: 0;
      outline: none;
      resize: none;
      background: var(--mw-bg);
      color: var(--mw-text);
      font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      tab-size: 2;
    }
    body.source-open #source { display: block; }
    body.source-open #app { display: none; }
    /* The outline sidebar pushes #app aside with padding, but #source is
       positioned over the whole window — give it the same clearance, or the
       sidebar covers the first 240px of the text. The centring calc uses
       percentages, so the column re-centres in what remains. */
    body.outline-open #source { left: 240px; width: auto; }

    /* --- Inline LaTeX ------------------------------------------------------ */
    /* Crepe pads equations by 4px a side, which shows up as a gap that isn't in
       the markdown (and doubles the gap where a real space *is*). Sit flush and
       on the text baseline instead. `-webkit-user-drag` is what actually lets a
       drag-selection start on top of an equation. */
    .milkdown .editor span[data-type='math_inline'] {
      padding: 0;
      vertical-align: baseline;
      -webkit-user-drag: none;
    }
    /* Crepe's own equation tooltip is broken upstream (it renders a confirm
       button next to an empty box); src/latex.js supplies a working one. */
    .milkdown-latex-inline-edit { display: none !important; }

    .mw-math-edit {
      position: fixed;
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 220px;
      max-width: min(460px, 90vw);
      padding: 8px;
      background: var(--mw-popup);
      border: 1px solid var(--mw-popup-border);
      border-radius: 8px;
      box-shadow: 0 6px 20px var(--mw-shadow);
    }
    .mw-math-edit[data-show='false'] { display: none; }
    .mw-math-input {
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--mw-text);
      padding: 5px 7px;
      border: 1px solid var(--mw-popup-border);
      border-radius: 5px;
      outline: none;
      background: var(--mw-field);
    }
    .mw-math-input:focus { border-color: var(--mw-link); background: var(--mw-popup); }
    .mw-math-preview {
      min-height: 20px;
      padding: 2px 7px 4px;
      text-align: center;
      overflow-x: auto;
      color: var(--mw-text);
    }

    /* --- Link tooltip: "Copied!" confirmation on the copy button ----------- */
    .link-preview .link-icon.mw-copied { position: relative; color: var(--mw-success); transform: scale(1.12); transition: transform .12s ease; }
    .link-preview .link-icon.mw-copied::after {
      content: 'Copied!';
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--mw-success);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 5px;
      white-space: nowrap;
      pointer-events: none;
      animation: mw-copied-pop 1.2s ease forwards;
    }
    @keyframes mw-copied-pop {
      0%   { opacity: 0; transform: translate(-50%, 4px); }
      15%  { opacity: 1; transform: translate(-50%, 0); }
      80%  { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -2px); }
    }

    /* --- Document outline sidebar (hidden by default) ---------------------- */
    #outline {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 240px;
      box-sizing: border-box;
      padding: 20px 8px 24px 16px;
      overflow-y: auto;
      background: var(--mw-panel);
      border-right: 1px solid var(--mw-panel-border);
      -webkit-user-select: none;
      user-select: none;
      display: none;
      z-index: 50;
    }
    body.outline-open #outline { display: block; }
    /* Push the editor column clear of the sidebar when it's open. */
    body.outline-open #app { padding-left: 240px; }
    .outline-title {
      font: 600 11px/1 -apple-system, system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mw-faint);
      padding: 0 8px 10px;
    }
    .outline-empty {
      font: 13px -apple-system, system-ui, sans-serif;
      color: var(--mw-faint);
      padding: 4px 8px;
    }
    .outline-list { display: flex; flex-direction: column; }
    .outline-item {
      display: block;
      font: 13px/1.35 -apple-system, system-ui, sans-serif;
      color: var(--mw-heading) !important;
      text-decoration: none !important;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .outline-item:hover { background: var(--mw-panel-hover); }
    .outline-item.h1 { font-weight: 600; }
    .outline-item.h2 { padding-left: 20px; }
    .outline-item.h3 { padding-left: 32px; color: var(--mw-muted) !important; }
    .outline-item.h4 { padding-left: 44px; color: var(--mw-faint) !important; }
    .outline-item.h5 { padding-left: 56px; color: var(--mw-faint) !important; }
    .outline-item.h6 { padding-left: 68px; color: var(--mw-faint) !important; }

    /* The editor's text size is a reading comfort, not a property of the
       document — while capturing, swap it for the export's own Scale option
       (`--mw-print-scale`, set by preparePdfExport; 1 when absent). That scale
       is typographic: at 50% the text is half-size and re-wraps to fill the
       full printable width, rather than the 100% layout shrunk on the page.
       !important so this outranks the inline custom property that
       setTextScale puts on <html>. */
    html.mw-pdf-export { --mw-scale: var(--mw-print-scale, 1) !important; }

    /* PDF export is deliberately print-friendly even when the editor is dark. */
    html.mw-pdf-export {
      color-scheme: light;
      --mw-bg: #ffffff;
      --mw-text: #24292e;
      --mw-link: #0b66c3;
      --mw-panel: #f7f7f8;
      --mw-panel-border: #e4e4e7;
      --mw-panel-hover: #e9e9ec;
      --mw-heading: #3f3f46;
      --mw-muted: #52525b;
      --mw-faint: #8a8a8e;
      --mw-popup: #ffffff;
      --mw-popup-border: #d9d9de;
      --mw-field: #fbfbfc;
      --mw-success: #1a7f37;
      --mw-shadow: rgba(0, 0, 0, .14);
      --mw-code-text: #24292e;
      --mw-code-comment: #6a737d;
      --mw-code-keyword: #d73a49;
      --mw-code-string: #032f62;
      --mw-code-number: #005cc5;
      --mw-code-function: #6f42c1;
      --mw-code-type: #22863a;
      --mw-code-invalid: #b31d28;
    }
    html.mw-pdf-export .milkdown {
      --crepe-color-background: #ffffff;
      --crepe-color-on-background: #000000;
      --crepe-color-surface: #f7f7f7;
      --crepe-color-surface-low: #ededed;
      --crepe-color-on-surface: #1c1c1c;
      --crepe-color-on-surface-variant: #4d4d4d;
      --crepe-color-outline: #a8a8a8;
      --crepe-color-primary: #333333;
      --crepe-color-secondary: #cfcfcf;
      --crepe-color-on-secondary: #000000;
      --crepe-color-inverse: #f0f0f0;
      --crepe-color-on-inverse: #1a1a1a;
      --crepe-color-inline-code: #ba1a1a;
      --crepe-color-error: #ba1a1a;
      --crepe-color-hover: #e0e0e0;
      --crepe-color-selected: #d5d5d5;
      --crepe-color-inline-area: #cacaca;
    }

    @media print {
      html, body, #app, .milkdown {
        width: auto !important;
        height: auto !important;
        min-height: 0 !important;
        overflow: visible !important;
        background: #fff !important;
      }
      body.outline-open #app { padding-left: 0 !important; }
      .milkdown .editor,
      .milkdown .ProseMirror {
        width: auto !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #outline,
      #find-bar,
      #source,
      .milkdown-block-handle,
      .milkdown-slash-menu,
      .milkdown-link-preview,
      .link-preview,
      .mw-math-edit,
      .milkdown-latex-inline-edit,
      .milkdown-image-block .operation,
      .milkdown-image-block .image-resize-handle,
      .mw-image-resize,
      .milkdown-code-block .tools {
        display: none !important;
      }
      .milkdown, .milkdown * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .milkdown .ProseMirror-selectednode,
      .milkdown .milkdown-code-block.selected,
      .milkdown .milkdown-image-block.selected,
      .milkdown .milkdown-image-inline.selected {
        outline: none !important;
        background: transparent !important;
      }
      .milkdown h1,
      .milkdown h2,
      .milkdown h3,
      .milkdown h4,
      .milkdown h5,
      .milkdown h6 {
        break-after: avoid-page;
      }
      .milkdown tr,
      .milkdown img,
      .milkdown figure,
      .milkdown .milkdown-image-block {
        break-inside: avoid-page;
      }
      /* WebKit can't split a flex container across pages, and Crepe lays each
         list item out as one (marker beside content). A list item taller than
         the space left on the page therefore can't be broken and is pushed to
         the next page whole, stranding inches of blank behind it. Floating the
         marker instead leaves the content as ordinary block flow, which
         fragments normally. 34px = the 24px marker plus its 10px gap. */
      /* !important throughout: Crepe's own selector is more specific, and
         applying only part of this would indent twice while still not letting
         the item break. */
      .milkdown li.list-item { display: block !important; }
      .milkdown li.list-item > .label-wrapper { float: left !important; }
      .milkdown li.list-item > .children { margin-left: 34px !important; }

      .milkdown table { width: 100%; }
      .milkdown pre,
      .milkdown pre code,
      .milkdown .cm-content,
      .milkdown .cm-line {
        white-space: pre-wrap !important;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      /* CodeMirror's 100%-height scroller fragments across pages as a tall
         scrollbar. Let code blocks participate in normal print flow. */
      .milkdown .milkdown-code-block,
      .milkdown .milkdown-code-block .cm-editor,
      .milkdown .milkdown-code-block .cm-scroller {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      .milkdown .milkdown-code-block .cm-content {
        min-height: 0 !important;
      }
      .milkdown img {
        max-width: 100% !important;
        height: auto !important;
      }
      /* A resized image wider than the page clamps back to it (this needs to
         out-rank the on-screen `max-width: none`, hence the full selector),
         and the margin that centres its overflow on screen would push a
         clamped image off-centre, so auto margins take over. */
      .milkdown .editor .image-wrapper[data-mw-width] img {
        max-width: 100% !important;
      }
      .milkdown .editor .image-wrapper {
        margin: 0 auto !important;
      }
    }
  </style>
</head>

  <div id="outline"></div>
  <div id="app"></div>
  <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
  <script src="./bundle.js"></script>
</body>
