<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Markwise</title>
  <link rel="stylesheet" href="./bundle.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    #app { height: 100vh; overflow: auto; }
    .milkdown { height: 100%; }
    /* Give the text a comfortable centered column like Typora. */
    .milkdown .editor { max-width: 860px; margin: 0 auto; padding: 32px 24px 64px; }
    /* Links: classic blue, underlined, pointer cursor. */
    .milkdown .editor a,
    .milkdown .editor a * { color: #0b66c3 !important; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./bundle.js"></script>
</body>
</html>
